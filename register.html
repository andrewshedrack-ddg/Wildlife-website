<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Register | WildGuard Society</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .login-container {
      max-width: 400px;
      margin: 2rem auto;
      padding: 2rem;
      background: rgba(255, 255, 255, 0.9);
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
      backdrop-filter: blur(10px);
    }
    .login-header {
      text-align: center;
      margin-bottom: 2rem;
    }
    .login-header h1 {
      color: #0f2a20;
      margin-bottom: 0.5rem;
    }
    .login-form {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    .form-group label {
      font-weight: 600;
      color: #0f2a20;
    }
    .form-group input {
      padding: 0.75rem 1rem;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-size: 1rem;
      transition: border-color 0.3s ease;
    }
    .form-group input:focus {
      outline: none;
      border-color: #0f2a20;
    }
    .submit-btn {
      background: #0f2a20;
      color: white;
      border: none;
      padding: 1rem;
      border-radius: 8px;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.3s ease;
    }
    .submit-btn:hover {
      background: #0a1e17;
    }
    .error-message {
      background: #fee2e2;
      color: #991b1b;
      padding: 0.75rem 1rem;
      border-radius: 8px;
      border-left: 4px solid #dc2626;
      display: none;
    }
    .logo {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      margin-bottom: 1rem;
    }
    .logo-icon {
      width: 48px;
      height: 48px;
      background: linear-gradient(135deg, #10b981, #059669);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: bold;
    }
    .success-message {
      background: #dcfce7;
      color: #166534;
      padding: 0.75rem 1rem;
      border-radius: 8px;
      border-left: 4px solid #16a34a;
      display: none;
      margin-bottom: 1rem;
    }
    .switch-link {
      text-align: center;
      margin-top: 1.5rem;
      font-size: 0.9rem;
      color: #0f2a20;
    }
    .switch-link a {
      color: #10b981;
      text-decoration: none;
    }
    .switch-link a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <header class="navbar">
    <div class="logo-container">
      <a href="index.html"><img src="assets/images/logo.png" alt="Logo" class="logo-img"></a>
      <span class="logo-text">WildGuard Society</span>
    </div>
    <button class="mobile-menu-toggle" aria-label="Open menu"><i class="fas fa-bars"></i></button>
    <nav>
      <ul>
        <li><a href="index.html" class="nav-link"><i class="fas fa-home"></i><span>Home</span></a></li>
        <li><a href="library/library.html" class="nav-link"><i class="fas fa-book"></i><span>Library</span></a></li>
        <li><a href="scan.html" class="nav-link"><i class="fas fa-barcode"></i><span>Scan</span></a></li>
        <li><a href="about.html" class="nav-link"><i class="fas fa-info-circle"></i><span>About</span></a></li>
        <li><a href="contact.html" class="nav-link"><i class="fas fa-envelope"></i><span>Contact</span></a></li>
        <li><a href="admin-login.html" class="nav-link"><i class="fas fa-shield-halved"></i><span>Admin</span></a></li>
      </ul>
    </nav>
  </header>
  <div class="login-container">
    <div class="login-header">
      <div class="logo">
        <div class="logo-icon">WG</div>
      </div>
      <h1>Create Account</h1>
      <p>Join the WildGuard Society community</p>
    </div>
    
    <div id="error-message" class="error-message"></div>
    <div id="success-message" class="success-message"></div>
    
    <form id="register-form" class="login-form">
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required placeholder="Enter your email">
      </div>
      
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required placeholder="Create password">
      </div>
      
      <div class="form-group">
        <label for="confirm-password">Confirm Password</label>
        <input type="password" id="confirm-password" name="confirm-password" required placeholder="Confirm password">
      </div>
      
      <button type="submit" class="submit-btn">Register</button>
    </form>
    
    <div class="switch-link">
      Already have an account? <a href="login.html">Login here</a>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const registerForm = document.getElementById('register-form');
      const errorMessage = document.getElementById('error-message');
      const successMessage = document.getElementById('success-message');
      
      registerForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        const confirmPassword = document.getElementById('confirm-password').value;
        
        // Clear previous messages
        errorMessage.style.display = 'none';
        errorMessage.textContent = '';
        successMessage.style.display = 'none';
        successMessage.textContent = '';
        
        if (password !== confirmPassword) {
          errorMessage.textContent = 'Passwords do not match';
          errorMessage.style.display = 'block';
          return;
        }
        
        try {
          const response = await fetch('/api/register', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({ email, password }),
            credentials: 'include'
          });
          
          if (!response.ok) {
            const errorData = await response.json();
            throw new Error(errorData.message || 'Registration failed');
          }
          
          // Show success message
          successMessage.textContent = 'Registration successful! Please login.';
          successMessage.style.display = 'block';
          // Reset form
          registerForm.reset();
          // Optionally redirect after delay
          setTimeout(() => {
            window.location.href = 'login.html';
          }, 1500);
        } catch (error) {
          errorMessage.textContent = error.message;
          errorMessage.style.display = 'block';
        }
      });
    });
  </script>
</body>
</html>
