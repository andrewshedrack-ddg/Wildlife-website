<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Portal | WildGuard Society</title>
  <link rel="icon" type="image/png" href="assets/images/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=4">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="portal-root">
  <header class="portal-header">
    <div class="portal-header-logo">
      <img src="assets/images/logo.png" alt="WildGuard">
      <span>Admin Portal</span>
    </div>
    <div class="portal-header-actions">
      <span id="admin-email-display">Loading...</span>
      <button onclick="portalLogout()"><i class="fas fa-sign-out-alt"></i> Logout</button>
    </div>
  </header>
  <div class="portal-layout">
    <aside class="portal-sidebar">
      <nav>
        <button class="portal-nav-item active" data-section="dashboard"><i class="fas fa-tachometer-alt"></i> Dashboard</button>
        <button class="portal-nav-item" data-section="messages"><i class="fas fa-envelope"></i> Messages</button>
        <button class="portal-nav-item" data-section="scans"><i class="fas fa-image"></i> Scan Review</button>
        <button class="portal-nav-item" data-section="users"><i class="fas fa-users"></i> Users &amp; Roles</button>
        <button class="portal-nav-item" data-section="admins"><i class="fas fa-shield-halved"></i> Admins</button>
        <button class="portal-nav-item" data-section="logs"><i class="fas fa-clipboard-list"></i> Activity Log</button>
      </nav>
    </aside>
    <main class="portal-main" id="portal-content">
      <div style="text-align:center;padding:4rem;color:rgba(255,255,255,0.4)">
        <i class="fas fa-circle-notch fa-spin" style="font-size:2.5rem;margin-bottom:1rem"></i>
        <p>Loading admin portal...</p>
      </div>
    </main>
  </div>
  <script defer src="js/auth.js?v=4"></script>
  <script defer src="js/admin-portal.js?v=4"></script>
  <script>
    (function(){
      var user = null;
      try { user = JSON.parse(localStorage.getItem('wildguard_user') || 'null'); } catch(e){}
      if (!user || (user.role !== 'admin' && user.role !== 'super_admin' && user.email !== 'admin@wildguardsociety.org')) {
        window.location.href = 'admin-login.html';
      }
    })();
    function portalLogout() {
      if (confirm('Are you sure you want to logout?')) {
        localStorage.removeItem('wildguard_user');
        window.location.href = 'index.html';
      }
    }
    document.addEventListener('DOMContentLoaded', function() {
      var user = null;
      try { user = JSON.parse(localStorage.getItem('wildguard_user') || 'null'); } catch(e){}
      var display = document.getElementById('admin-email-display');
      if (display && user && user.email) display.textContent = user.email;
    });
  </script>
</body>
</html>
