<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Page Not Found | WildGuard Explorer</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Fraunces:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    .error-page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
      background: linear-gradient{text-gradient-bg}, rgba(27, 77, 62, 0.9)), url('assets/images/background.png') center/cover fixed no-repeat;
    }
    .error-code {
      font-family: 'Fraunces', serif;
      font-size: 8rem;
      font-weight: 800;
      color: var(--green);
      line-height: 1;
      margin-bottom: 1rem;
    }
    .error-title {
      font-size: 2rem;
      font-weight: 700;
      color: var(--dark);
      margin-bottom: 1rem;
    }
    .error-message {
      font-size: 1.1rem;
      color: var(--text-muted);
      max-width: 500px;
      margin-bottom: 2rem;
    }
    .error-actions {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      justify-content: center;
    }
    .btn {
      display: inline-block;
      background: var(--green);
      color: white;
      padding: 0.8rem 1.5rem;
      border-radius: var(--radius);
      text-decoration: none;
      font-weight: 600;
      transition: var(--transition);
    }
    .btn.ghost {
      background: transparent;
      border: 2px solid var(--green);
      color: var(--green);
    }
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-hover);
    }
  </style>
</head>
<body>
  <div class="error-page">
    <div class="error-code">404</div>
    <h1 class="error-title">Page Not Found</h1>
    <p class="error-message">The page you are looking for might have been moved, deleted, or never existed. Don't worry — you can explore our wildlife library or return home.</p>
    <div class="error-actions">
      <a href="index.html" class="btn"><i class="fas fa-home"></i> Go Home</a>
      <a href="library/mammals.html" class="btn ghost"><i class="fas fa-book-open"></i> Explore Library</a>
    </div>
  </div>
</body>
</html>
