<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="../css/style.css">
  <script defer src="../js/main.js"></script>
</head>
<body>
   <header class="navbar">
     <div class="logo-container">
       <img src="../assets/images/logo.png" alt="Logo" class="logo-img">
       <span class="logo-text">WildGuard Conservation Society</span>
     </div>
     <nav>
       <ul>
         <li>
           <div class="nav-item-group" data-page="../index.html">
             <div class="nav-item-icon">
               <i class="fas fa-home"></i>
             </div>
             <div class="nav-item-label">Home</div>
           </div>
         </li>
         <li>
           <div class="nav-item-group" data-page="../library/mammals.html">
             <div class="nav-item-icon">
               <i class="fas fa-book"></i>
             </div>
             <div class="nav-item-label">Library</div>
           </div>
         </li>
         <li>
           <div class="nav-item-group" data-page="../scan.html">
             <div class="nav-item-icon">

             </div>
             <div class="nav-item-label">Scan</div>
           </div>
         </li>
         <li>
           <div class="nav-item-group" data-page="../about.html">

             </div>
             <div class="nav-item-label">About</div>
           </div>
         </li>
         <li>
           <div class="nav-item-group" data-page="../contact.html">
             <div class="nav-item-icon">
               <i class="fas fa-envelope"></i>
             </div>
             <div class="nav-item-label">Contact</div>
           </div>
         </li>
       </ul>
     </nav>
   </header>

  <main>
    <section class="page-banner">
      <span class="eyebrow">User</span>
      <h1>Favorite animals.</h1>
      <p class="lede">A quick list of your saved species cards so the profile area stays useful as the catalog grows.</p>
    </section>

    <section class="info-card">
      <div class="content">
        <ul class="inline-list">
          <li>Lion</li>
          <li>Elephant</li>
          <li>Eagle</li>
          <li>Giraffe</li>
        </ul>
      </div>
    </section>

</html>
